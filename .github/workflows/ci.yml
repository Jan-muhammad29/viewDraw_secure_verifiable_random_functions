name: VeriDraw — SQL Server, cryptography and integration
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CI_TestOnly_DBPassword_2026!
        ports:
          - 1433:1433
    env:
      SQL_SERVER: 127.0.0.1
      SQL_PORT: '1433'
      SQL_DATABASE: VeriDraw
      SQL_USER: sa
      SQL_PASSWORD: CI_TestOnly_DBPassword_2026!
      SQL_ENCRYPT: 'true'
      SQL_TRUST_SERVER_CERTIFICATE: 'true'
      VRF_PRIVATE_KEY_HEX: 1111111111111111111111111111111111111111111111111111111111111111
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: CI_TestOnly_SecretPassword_NotProduction
      FRONTEND_ORIGIN: http://127.0.0.1:5173
      ENABLE_DEMO: 'true'
      NODE_ENV: test
      PORT: '5000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:wait
      - run: npm run db:create
      - run: npm run db:migrate
      - run: npm run db:admin
      - name: Boot API and execute integration checks
        shell: bash
        run: |
          npm start > /tmp/veridraw-api.log 2>&1 &
          node scripts/smoke.mjs || (cat /tmp/veridraw-api.log && exit 1)
